# Streamlit Security Configuration

[server]
# Let the deployment environment choose the listening address.
port = 8501
headless = true

# Keep CORS and XSRF protection enabled together.
enableCORS = true

# SECURITY: Enable XSRF protection
enableXsrfProtection = true

# SECURITY: File upload limits (50MB max)
maxUploadSize = 50
maxMessageSize = 200

# SECURITY: Run check for updates (keep dependencies current)
runOnSave = false

[browser]
# SECURITY: Disable usage statistics collection
gatherUsageStats = false

# Hosted environments supply their public browser address and port.

[theme]
base = "dark"
primaryColor = "#FF4B4B"
backgroundColor = "#0d1117"
secondaryBackgroundColor = "#1f2937"
textColor = "#e5e7eb"
font = "sans serif"

